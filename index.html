<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KoolChat | Login & Sign Up</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
body {
    min-height: 100vh;
    background: #fffefe;
    color: #222;
}
.topbar {
    width: 100%;
    height: 70px;
    padding: 0 7%;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
}
.logo {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #222;
    color: #fff;
    border-radius: 50%;
    font-size: 21px;
    font-weight: bold;
}
.brand-name {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -0.5px;
}
main {
    min-height: calc(100vh - 70px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
}
.container {
    width: min(350px, 100%);
    padding: 30px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
}
h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #222;
}
label {
    display: block;
    margin-bottom: 6px;
    color: #444;
    font-size: 14px;
}
input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    outline: none;
    font-size: 14px;
}
input:focus {
    border-color: #333;
}
.logo {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 50%; /* agar gol logo chahiye to */
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

button {
    width: 100%;
    padding: 12px;
    background: #222;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
}
.toggle {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #555;
}
.toggle a {
    color: #000;
    font-weight: bold;
    text-decoration: none;
}
.toggle a:hover {
    text-decoration: underline;
}
/* CSS-only switch between forms */
#signup {
    display: none;
}
#signup:target {
    display: block;
}
#signup:target ~ #login {
    display: none;
}
@media (max-width: 480px) {
    .topbar {
        padding: 0 20px;
    }
}
</style>
</head>
<body>
<header class="topbar">
    <div class="logo" aria-label="Koolchat logo">
  <img src="https://i.postimg.cc/rwPww7Fg/IMG-20261014-192232.png" alt="KoolChat Logo"></div>
    <div class="brand-name">KoolChat</div>
</header>

<main>
    <div class="container">
        <section id="signup">
            <h2>Create Account</h2>
            <form action="#" method="get" id="signup-form">
                <label for="signup-email">Email address</label>
                <input type="email" id="signup-email" name="signup-email" placeholder="Enter your email" autocomplete="email" required>

                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" name="signup-password" placeholder="Create a password" autocomplete="new-password" minlength="6" required>

                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" autocomplete="new-password" minlength="6" required>

                <button type="submit">Create Account</button>
            </form>
            <p class="toggle">Already have an account? <a href="#login">Log In</a></p>
        </section>

        <section id="login">
            <h2>Login</h2>
            <form action="#" method="get" id="login-form">
                <label for="login-email">Email address</label>
                <input type="email" id="login-email" name="email" placeholder="Enter your email" autocomplete="email" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

                <button type="submit">Log In</button>
            </form>
            <p class="toggle">Don't have an account? <a href="#signup">Sign-Up</a></p>
        </section>
    </div>
</main>

<script src="env1.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";


const firebaseConfig = {
  apiKey: window.env.FIREBASE_API_KEY,
  authDomain: window.env.FIREBASE_AUTH_DOMAIN,
  projectId: window.env.FIREBASE_PROJECT_ID,
  storageBucket: window.env.FIREBASE_STORAGE_BUCKET,
  messagingSenderId: window.env.FIREBASE_MESSAGING_SENDER_ID,
  appId: window.env.FIREBASE_APP_ID,
  measurementId: window.env.FIREBASE_MEASUREMENT_ID
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);


const auth = getAuth(app);


document.querySelector('#signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.querySelector('#signup-email').value;
  const password = document.querySelector('#signup-password').value;
  await createUserWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {

      const user = userCredential.user;
      alert("User created successfully!");
    })
    .catch((error) => {
      alert(`Error creating user: ${error.message}`);
    });

});

document.querySelector('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.querySelector('#login-email').value;
  const password = document.querySelector('#login-password').value;
  await signInWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {

      const user = userCredential.user;
      alert("User logged in successfully!");
    })
    .catch((error) => {
      alert(`Error logging in: ${error.message}`);
    });

});


</script>




</body>
</html>
